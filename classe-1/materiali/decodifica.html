<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decodifica dei codici &mdash; classe 1&ordf;</title>
<!-- Pagina generata da 02_Esercizi e Verifiche/_archivio/esercizi.py.
     Non si corregge qui: si corregge in esercizi.json e si rigenera.

     I pesi, il tetto e la formula del voto NON sono scritti in questa
     pagina: arrivano incorporati piu' sotto, presi dall'archivio. Se
     stessero anche qui, cambiare un peso lascerebbe la decodifica a
     calcolare col vecchio, e il voto sarebbe sbagliato senza che niente
     lo segnali. -->
<link rel="stylesheet" href="../../_assets/css/tac.css?v=ba0241b9">
<link rel="stylesheet" href="../../_assets/css/sito.css?v=d95f60fb">
<script src="../../_assets/js/codice.js?v=d08015bc" defer></script>
<style>
  .dec-griglia { display: grid; gap: 1.4rem; grid-template-columns: 1fr; }
  @media (min-width: 60rem) { .dec-griglia { grid-template-columns: 22rem 1fr; align-items: start; } }
  .dec-incolla { width: 100%; min-height: 16rem; font: inherit; font-size: .92rem;
                 font-family: ui-monospace, Menlo, monospace; padding: .7rem;
                 border: 1.5px solid var(--bordo); border-radius: 8px; resize: vertical; }
  table.dec { width: 100%; border-collapse: collapse; font-size: .93rem; }
  table.dec th { text-align: left; border-bottom: 2px solid var(--bordo);
                 padding: .45rem .5rem; font-size: .8rem; text-transform: uppercase;
                 letter-spacing: .04em; color: var(--inchiostro2); }
  table.dec td { border-bottom: 1px solid var(--bordo); padding: .45rem .5rem; }
  table.dec tr.guasto td { background: #fef2f2; color: #991b1b; }
  table.dec .voto { font-weight: 800; font-size: 1.05rem; }
  table.dec .sigla { font-family: ui-monospace, Menlo, monospace; font-size: .84rem;
                     color: var(--inchiostro2); }
  .dec-avviso { margin: .8rem 0 0; font-size: .88rem; color: var(--inchiostro2); }
</style>
</head>
<body class="documento">

<nav class="barra-sito no-stampa">
  <div class="barra-sito-interna">
    <a href="../../">Corso</a>
    <span class="sep">&rsaquo;</span>
    <a href="../">Classe 1&ordf;</a>
    <span class="sep">&rsaquo;</span>
    <span class="qui">Decodifica</span>
  </div>
</nav>

<div class="foglio">
  <div class="intestazione-scheda">
    <div>
      <h1>Decodifica dei codici</h1>
      <p style="margin:.3rem 0 0; color:var(--inchiostro2)">Incolla i codici raccolti su Classroom, uno per riga.</p>
    </div>
    <div class="dati">Teoria, Analisi e Composizione<br>Classe 1&ordf;</div>
  </div>

  <div class="dec-griglia">
    <div>
      <textarea class="dec-incolla" id="dentro" spellcheck="false"
        placeholder="C1U1V/MRHV/78-100/T1/K4F2&#10;C1U1V/AB7F/91-100/T2/9QW3"></textarea>
      <p class="dec-avviso">Va bene anche incollare il testo intero di una
        consegna: i codici vengono riconosciuti in mezzo al resto.</p>
      <button class="btn" id="fai" style="margin-top:.7rem">Decodifica</button>
      <button class="btn secondario" id="csv" style="margin-top:.7rem">Copia per il registro</button>
    </div>
    <div id="fuori"></div>
  </div>
</div>

<script id="dec-dati" type="application/json">{
 "verifiche": {
  "C1U1V": {
   "titolo": "Verifica di fine unità 1",
   "unita": 1,
   "classe": 1,
   "dove": "casa",
   "esercizi": [
    {
     "id": "C1-U1-L1-03",
     "titolo": "Ogni parola al suo posto · il battito",
     "peso": 3
    },
    {
     "id": "C1-U1-L1-04",
     "titolo": "Vero o falso · il battito",
     "peso": 3
    }
   ]
  }
 },
 "voto": {
  "minimo": 4.0,
  "sufficienza": 6.0,
  "soglia": 0.6,
  "tetto": {
   "casa": 9.0,
   "uda": 10.0
  },
  "calo": 0.1,
  "fondo": 0.7
 }
}</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById('dec-dati').textContent);
  var V = D.voto;

  function fattore(t) { return Math.max(V.fondo, 1 - V.calo * (Math.max(1, t) - 1)); }

  function voto(resa, dove) {
    var alto = V.tetto[dove] !== undefined ? V.tetto[dove] : 10;
    var v;
    if (resa < V.soglia) {
      v = V.minimo + (V.sufficienza - V.minimo) * resa / V.soglia;
      /* Sotto la soglia non si arrotonda mai fino alla sufficienza: una
         resa del 55% darebbe 5,83, cioe' 6, e un insufficiente
         diventerebbe sufficiente per colpa dell'arrotondamento. */
      v = Math.min(v, V.sufficienza - 0.5);
    } else {
      v = V.sufficienza + (alto - V.sufficienza) * (resa - V.soglia) / (1 - V.soglia);
    }
    return Math.round(v * 2) / 2;
  }

  /* I codici si pescano dentro al testo invece di pretendere una riga
     pulita: quello che arriva da Classroom e' quasi sempre un commento con
     dentro il codice, non il codice da solo. Chiedere all'insegnante di
     ripulirlo a mano sarebbe restituirgli il lavoro che questa pagina
     dovrebbe togliergli. */
  var TROVA = /[A-Z0-9]+\/[A-Z0-9]+\/\d+-\d+\/T\d+\/[A-Z0-9]{4}/gi;

  function decodifica() {
    var testo = document.getElementById('dentro').value;
    var trovati = testo.toUpperCase().match(TROVA) || [];
    var righe = trovati.map(function (c) { return window.TACCodice.leggi(c); });

    /* Uno studente puo' consegnare piu' volte. Si tiene il tentativo piu'
       alto, non il punteggio migliore: e' quello che racconta come e'
       andata davvero, ed e' anche quello che il calo dei tentativi deve
       colpire. Tenere il migliore premierebbe chi rifa' finche' non viene. */
    var per = {};
    righe.forEach(function (r) {
      if (!r.valido) { (per['!' + Math.random()] = r); return; }
      var k = r.persona + '|' + r.scheda;
      if (!per[k] || r.tentativo > per[k].tentativo) per[k] = r;
    });

    var elenco = Object.keys(per).map(function (k) { return per[k]; });
    elenco.sort(function (a, b) {
      return (a.persona || '').localeCompare(b.persona || '');
    });

    var righeHtml = elenco.map(function (r) {
      if (!r.valido) {
        return '<tr class="guasto"><td colspan="6">' +
          (r.grezzo || '(vuoto)') + ' &mdash; ' + r.perche + '</td></tr>';
      }
      var prova = D.verifiche[r.scheda];
      var dove = prova ? prova.dove : 'casa';
      var resa = r.massimo ? (r.punti / r.massimo) * fattore(r.tentativo) : 0;
      var v = voto(resa, dove);
      return '<tr>' +
        '<td>' + r.iniziali + '</td>' +
        '<td class="sigla">' + r.persona + '</td>' +
        '<td>' + (prova ? prova.titolo : '<span class="sigla">' + r.scheda + '</span>') + '</td>' +
        '<td>' + r.punti + ' / ' + r.massimo + '</td>' +
        '<td>' + (r.tentativo > 1 ? r.tentativo + '&ordm;' : '1&ordm;') + '</td>' +
        '<td class="voto">' + v.toString().replace('.', ',') + '</td>' +
        '</tr>';
    }).join('');

    var buoni = elenco.filter(function (r) { return r.valido; }).length;
    document.getElementById('fuori').innerHTML = elenco.length
      ? '<table class="dec"><thead><tr><th>Iniziali</th><th>Sigla</th>' +
        '<th>Prova</th><th>Punti</th><th>Tent.</th><th>Voto</th></tr></thead>' +
        '<tbody>' + righeHtml + '</tbody></table>' +
        '<p class="dec-avviso">' + buoni + ' codici validi su ' + elenco.length +
        '. Se uno studente compare due volte e&rsquo; perch&eacute; ha consegnato ' +
        'prove diverse: si tiene sempre il tentativo pi&ugrave; alto.</p>'
      : '<p class="dec-avviso">Nessun codice riconosciuto nel testo incollato.</p>';

    window._decElenco = elenco;
  }

  document.getElementById('fai').onclick = decodifica;

  document.getElementById('csv').onclick = function () {
    var e = window._decElenco || [];
    var testo = 'iniziali	sigla	prova	punti	massimo	tentativo	voto
' +
      e.filter(function (r) { return r.valido; }).map(function (r) {
        var p = D.verifiche[r.scheda];
        var resa = r.massimo ? (r.punti / r.massimo) * fattore(r.tentativo) : 0;
        return [r.iniziali, r.persona, p ? p.titolo : r.scheda, r.punti,
                r.massimo, r.tentativo,
                voto(resa, p ? p.dove : 'casa').toString().replace('.', ',')
               ].join('	');
      }).join('
');
    navigator.clipboard.writeText(testo);
    this.textContent = 'Copiato';
    var b = this; setTimeout(function () { b.textContent = 'Copia per il registro'; }, 1800);
  };
})();
</script>
</body>
</html>
